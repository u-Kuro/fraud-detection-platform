[project]
name = "fraud_detection_api"
version = "1.0.0"
dependencies = [
    "fastapi==0.136.3",
    "pandas==2.3.3",
    "slack-bolt==1.30.0",
    "shared",
]

[dependency-groups]
test = [
    "pyfakefs==6.2.0",
    "pytest==9.1.1",
    "pytest-env==1.7.0",
    "pytest-mock==3.15.1",
]
dev = [
    { include-group = "test" }
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fraud_detection_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["[a-z]*.py"]
env = [
