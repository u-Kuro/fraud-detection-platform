[project]
name = "fraud_detection_api"
version = "1.0.0"
dependencies = [
    "fastapi==0.136.3",
    "pandas==2.3.3",
    "slack-bolt==1.30.0",
    "shared",
]

[dependency-groups]
test = [
    "pyfakefs==6.2.0",
    "pytest==9.1.1",
    "pytest-env==1.7.0",
    "pytest-mock==3.15.1",
]
dev = [
    { include-group = "test" }
]

[tool.uv.sources]
"shared" = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fraud_detection_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["[a-z]*.py"]
env = [
    # modules/environment/mwaa.py
    "AWS_DEFAULT_REGION=aws-region-default",
    "MWAA_ENVIRONMENT_NAME=mwaa-environment-default",
    # modules/environment/s3.py
    "AWS_DEFAULT_REGION=aws-region-default",
    # modules/environment/slack.py
    "SLACK_APP_LEVEL_TOKEN=slack-app-token-default",
    "SLACK_BOT_USER_OAUTH_TOKEN=slack-bot-token-default",
    "SLACK_CHANNEL_ID=C000000000",
    "SLACK_SIGNING_SECRET=slack-signing-secret-default",
]