[project]
name = "services"
version = "1.0.0"
requires-python = "==3.12.13"

[dependency-groups]
# helpers
lint = [
    "ruff==0.16.5",
]
stubs = [
    "boto3-stubs[mwaa,s3]==1.43.83",
    "matplotlib-stubs==0.3.11",
    "pandas-stubs==3.0.5.260730",
    "pyarrow-stubs==20.0.0.20260819",
    "types-seaborn==0.13.2.20260728",
]
type_check = [
    "mypy==2.3.1",
]
dev = [
    { include-group = "lint" },
    { include-group = "stubs" },
    { include-group = "type-check" },
]

[tool.uv]
required-version = "0.12.6"

[tool.uv.workspace]
members = [
    "dags_images/*",
    "fraud_detection_api",
    "shared",
]