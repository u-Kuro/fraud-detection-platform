[project]
name = "archive"
version = "1.0.0"
dependencies = [
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    "shared",
]

[dependency-groups]
test = [
    "pyfakefs==6.2.0",
    "pytest==9.1.1",
    "pytest-env==1.7.0",
    "pytest-mock==3.15.1",
]
dev = [
    { include-group = "test" },
]

[tool.uv.sources]
"shared" = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["[a-z]*.py"]
env = [
    # modules/environment/archive.py
    "TRANSACTION_INFERENCES_ISO_DATETIME_CUTOFF=0001-01-01T00:00:00+00:00",
    # modules/environment/s3.py
    "S3_BUCKET_NAME=s3-bucket-default",
]