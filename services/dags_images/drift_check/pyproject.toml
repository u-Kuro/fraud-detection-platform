[project]
name = "drift_check"
version = "1.0.0"
dependencies = [
    "evidently==0.7.21",
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    "scikit-learn==1.9.0",
    "shared",
]

[dependency-groups]
test = [
    "pyfakefs==6.2.0",
    "pytest==9.1.1",
    "pytest-env==1.7.0",
    "pytest-mock==3.15.1",
]
dev = [
    { include-group = "test" }
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "**/*.py" },
]

[tool.uv.sources]
"shared" = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drift_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["[a-z]*.py"]
env = [
    # drift_check/modules/environment/drift_check.py
    "ACTIVE_MODEL_DEPLOYMENT_MLFLOW_RUN_ID=active-mlflow-run-default",
    # shared/modules/environment/mlflow.py
    "MLFLOW_TRACKING_URI=http://localhost:0000",
    "MLFLOW_TRACKING_USERNAME=mlflow-username-default",
    "MLFLOW_TRACKING_PASSWORD=mlflow-password-default",
    "MLFLOW_WORKSPACE=mlflow-workspace-default",
    # shared/modules/environment/postgres.py
    "PGHOST=postgres-host-default",
    "PGPORT=0000",
    "PGDATABASE=postgres-database-default",
    "PGUSER=postgres-user-default",
    "PGPASSWORD=postgres-password-default",
    # shared/modules/environment/s3.py
    "AWS_DEFAULT_REGION=aws-region-default",
    "AWS_ENDPOINT_URL_S3=http://localhost:0000",
    "AWS_ACCESS_KEY_ID=aws-access-default",
    "AWS_SECRET_ACCESS_KEY=aws-secret-default",
    "S3_BUCKET_NAME=s3-bucket-default",
]