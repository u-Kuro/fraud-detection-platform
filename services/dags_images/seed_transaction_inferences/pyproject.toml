[project]
name = "seed_transaction_inferences"
version = "1.0.0"
dependencies = [
    "pandas==2.3.3",
    "shared",
]

[dependency-groups]
test = [
    "pyfakefs==6.2.0",
    "pytest==9.1.1",
    "pytest-env==1.7.0",
    "pytest-mock==3.15.1",
]
dev = [
    { include-group = "test" },
]

[tool.uv.sources]
"shared" = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seed_transaction_inferences"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["[a-z]*.py"]
env = [
    # seed_transaction_inferences/modules/environment/seed.py
    "TRANSACTION_INFERENCES_SEED_S3_KEY=s3-key-default",
    # shared/modules/environment/s3.py
    "AWS_DEFAULT_REGION=aws-region-default",
    "AWS_ENDPOINT_URL_MWAA=http://localhost:0000",
    "AWS_ACCESS_KEY_ID=aws-access-default",
    "AWS_SECRET_ACCESS_KEY=aws-secret-default",
    "S3_BUCKET_NAME=s3-bucket-default",
]