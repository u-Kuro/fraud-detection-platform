[project]
name = "train_model"
version = "1.0.0"
dependencies = [
    "imbalanced-learn==0.14.2",
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "optuna==4.9.0",
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    "scikit-learn==1.9.0",
    "xgboost==3.4.1",
    "shared"
]

[dependency-groups]
test = [
    "pyfakefs==6.2.0",
    "pytest==9.1.1",
    "pytest-env==1.7.0",
    "pytest-mock==3.15.1",
]
dev = [
    { include-group = "test" }
]

[tool.uv.sources]
"shared" = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["train_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["[a-z]*.py"]
env = [
    # modules/environment/mlflow.py
    "MLFLOW_TRACKING_URI=http://localhost:0000",
    "MLFLOW_WORKSPACE=mlflow-workspace-default",
]