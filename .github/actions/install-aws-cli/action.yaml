name: Install AWS CLI
description: Install AWS CLI v2, nektos/act containers don't have it.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        VERSION="2.36.32"
        
        AWS_DIRECTORY="${RUNNER_TEMP}/aws-cli"
        mkdir --parents "${AWS_DIRECTORY}"
        
        AWS_INSTALLER_ZIP="${AWS_DIRECTORY}/awscli-${VERSION}.zip"
        curl --silent --location --output "${AWS_INSTALLER_ZIP}" "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${VERSION}.zip"
        
        unzip -q "${AWS_INSTALLER_ZIP}" -d "${AWS_DIRECTORY}"

        sudo "${AWS_DIRECTORY}/aws/install"