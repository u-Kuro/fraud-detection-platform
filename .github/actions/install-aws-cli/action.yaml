name: Install AWS CLI
description: Install AWS CLI v2, nektos/act containers don't have it.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        VERSION="2.36.32"
        ARCHIVE="awscli-${VERSION}.zip"
        
        curl --silent --location --output "${ARCHIVE}" "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${VERSION}.zip"
        unzip -q "${ARCHIVE}"
        sudo ./aws/install