name: CI / Fraud Detection API

on:
  pull_request:
    branches: [main]
    paths:
      - services/fraud_detection_api/**
      - services/shared/**
      - pyproject.toml
      - uv.lock

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }} # MiniStack URL

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Test
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build runtime (dry run)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max