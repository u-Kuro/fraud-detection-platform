name: Test / Pull Request

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print event
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          [ -n "$PR_NUMBER" ] && echo "PR #$PR_NUMBER" || echo "PR number: null"
          [ -n "$HEAD_REF" ] && echo "Head: $HEAD_REF" || echo "Head ref: null"
          [ -n "$BASE_REF" ] && echo "Base: $BASE_REF" || echo "Base ref: null"