name: CD / DAGs

on:
  push:
    branches: [main]
    paths:
      - dags/**
      - tests/dags/**
      - services/dags/**
      - services/shared/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  AWS_PAGER: ""

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      images_changed: ${{ steps.image-filter.outputs.changes }}
      dags_changed: ${{ steps.dags-filter.outputs.dags }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Allow dorny/paths-filter to get the whole history in nektos/act

      # Set dorny/paths-filter base to first commit to always proceed to succeeding jobs in nektos/act
      - name: Get initial commit
        id: initial-commit
        run: echo "sha=$(git rev-list --max-parents=0 HEAD)" >> ${GITHUB_OUTPUT}

      - uses: dorny/paths-filter@v4
        id: image-filter
        with:
          filters: .github/config/paths-filter/dags/cd/image-filter.yaml
          base: ${{ steps.initial-commit.outputs.sha }} # Set dorny/paths-filter base to first commit to always proceed to succeeding jobs in nektos/act
      - uses: dorny/paths-filter@v4
        id: dags-filter
        with:
          filters: .github/config/paths-filter/dags/cd/dags-filter.yaml
          base: ${{ steps.initial-commit.outputs.sha }} # Set dorny/paths-filter base to first commit to always proceed to succeeding jobs in nektos/act

  push-images:
    needs: detect-changes
    if: needs.detect-changes.outputs.images_changed != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ${{ fromJson(needs.detect-changes.outputs.images_changed) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-buildx-action
      - uses: ./.github/actions/install-aws-cli

      - name: Resolve Dockerfile path
        id: dockerfile-path
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          FOLDER="${IMAGE//-/_}"
          echo "path=services/dags/${FOLDER}/Dockerfile" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Create ECR repository
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          if ! aws ecr describe-repositories --repository-names "${IMAGE_NAME}" 2>/dev/null; then
            aws ecr create-repository --repository-name "${IMAGE_NAME}"
          fi

      - name: Login to Amazon ECR
        id: ecr-login
        uses: ./.github/actions/amazon-ecr-login

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          images: ${{ steps.ecr-login.outputs.registry }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.dockerfile-path.outputs.path }}
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          sbom: true
          provenance: mode=max

  sync-dags:
    needs: [detect-changes, push-images]
    if: |
      always()
      && needs.detect-changes.outputs.dags_changed == 'true'
      && (needs.push-images.result == 'success' || needs.push-images.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sync DAGs
        run: |
          # gsutil rsync -r ./dags gs://my-airflow-bucket/dags/