name: CI / Migrate

on:
  pull_request:
    branches: [main]
    paths:
      - database/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        ports: [5433:5432]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    env:
      DEV_URL: postgres://postgres:postgres@host.docker.internal:5433/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-atlas-community
      - name: Lint migrations
        working-directory: database
        run: atlas migrate lint --env test-dev