[project]
name = "notebooks"
version = "1.0.0"
requires-python = "==3.12.13"

[dependency-groups]
data_processing = [
    "numpy==2.5.2",
    "pandas==2.3.3",
]
interpretation = [
    "shap==0.52.0",
]
modeling = [
    "imbalanced-learn==0.14.2",
    "optuna==4.9.0",
    "scikit-learn==1.9.0",
    "torch==2.14.1",
    "xgboost==3.4.1",
]
notebook = [
    "ipykernel==7.3.0",
    "ipython==9.17.1",
    "tqdm==4.70.1",
]
repositories = [
    "mlflow==3.15.2",
]
visualization = [
    "kaleido==1.3.0",
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
]
# helpers
lint = [
    "ruff==0.16.5",
]
stubs = [
    "matplotlib-stubs==0.3.11",
    "pandas-stubs==3.0.5.260730",
    "types-seaborn==0.13.2.20260728",
]
type_check = [
    "mypy==2.3.1",
]

[tool.uv]
required-version = "0.12.6"
default-groups = [
    "data_processing",
    "modeling",
    "visualization",
    "repositories",
    "notebook",
    "lint",
    "stubs",
    "type_check",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch.index = "pytorch-cpu"
