[project]
name = "notebooks"
version = "1.0.0"
requires-python = "==3.12.*"

[dependency-groups]
data_processing = [
    "numpy==2.4.6",
    "pandas==2.3.3",
]
interpretation = [
    "shap==0.52.0",
]
modeling = [
    "imbalanced-learn==0.14.2",
    "optuna==4.9.0",
    "scikit-learn==1.9.0",
    "skops==0.16.0",
    "torch==2.14.1",
    "xgboost==3.4.1",
]
notebook = [
    "ipykernel==7.3.0",
    "ipython==9.17.1",
    "tqdm==4.70.1",
]
repositories = [
    "mlflow==3.15.2",
]
visualization = [
    "kaleido==1.3.0",
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
]
gpu = [
    "cuml-cu13==26.6.0 ; platform_machine == 'x86_64' and sys_platform == 'linux'",
]
# helpers
lint = [
    "ruff==0.16.5",
]
stubs = [
    "matplotlib-stubs==0.3.11",
    "pandas-stubs==3.0.5.260730",
    "types-seaborn==0.13.2.20260728",
]
type_check = [
    "mypy==2.3.1",
]

[tool.uv]
required-version = "==0.12.*"
default-groups = [
    "data_processing",
    "modeling",
    "visualization",
    "repositories",
    "notebook",
    "gpu",
    "lint",
    "stubs",
    "type_check",
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
